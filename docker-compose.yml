name: yapper-post

networks:
  yapper-post-db-net:

volumes:
  mongo-primary-data:
  mongo-secondary-data:

x-mongo-common: &mongo-commons
  command: |
    bash -c "
      mkdir -p /etc/mongo-keyfile && \
      echo \"$$MONGO_KEYFILE_CONTENT\" > /etc/mongo-keyfile/keyfile.txt && \
      chmod 600 /etc/mongo-keyfile/keyfile.txt && \
      mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile/keyfile.txt
    "
  environment:
    MONGO_INITDB_ROOT_USERNAME: admin
    MONGO_INITDB_ROOT_PASSWORD: password
    MONGO_KEYFILE_CONTENT: 
  healthcheck:
    test: ["CMD", "mongosh", "--eval", "db.adminCommand({ping: 1})"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - yapper-post-db-net

services:
  mongo-primary:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-primary-data:/data/db
    <<: *mongo-commons

  mongo-secondary:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongo-secondary-data:/data/db
    <<: *mongo-commons

  # Arbiter node (does not store data, only votes in elections)
  mongo-arbiter:
    image: mongo:latest
    ports:
      - "27019:27017"
    <<: *mongo-commons
  
   # This service will initiate the replica set
  mongo-init-replica:
    image: mongo:latest
    container_name: mongo-init-replica
    command: >
      bash -c "
        sleep 10 &&
        mongo --host mongodb1:27017 <<EOF
          var config = {
            _id: 'rs0',
            members: [
              { _id: 0, host: 'mongo-primary:27017' },
              { _id: 1, host: 'mongo-secondary:27017' },
              { _id: 2, host: 'mongo-arbiter:27017', arbiterOnly: true } # Mark this member as an arbiter
            ]
          };
          rs.initiate(config);
          rs.status();
        EOF
      "
    depends_on:
      - mongo-primary
      - mongo-secondary
      - mongo-arbiter 
    networks:
      - yapper-post-db-net